# Self-hosting: the app and the worker. PostgreSQL, S3-compatible storage and SMTP are yours:
# point DATABASE_URL, S3_* and EMAIL_URL at them in .env (copy .env.example; see docs/HOSTING.md).
# Put a TLS reverse proxy in front of APP_PORT. Production mode refuses plain HTTP and the explore key.
#
#   docker compose -f compose.production.yaml up -d --build

# `environment:` overrides env_file, so a copied .env.example cannot switch on debug, explore or the kit.
x-forced: &forced
  DJANGO_DEBUG: "false"
  SCHOLARSYNC_EXPLORE: "false"
  DJANGO_KIT: "false"

# The probe sends your first DJANGO_ALLOWED_HOSTS entry as Host plus X-Forwarded-Proto: https.
x-healthcheck: &healthcheck
  test: ["CMD", "python", "/app/docker/healthcheck.py"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

services:
  web:
    build: .
    image: scholarsync:production
    env_file: .env
    environment: *forced
    # Loopback only, for a TLS proxy on this machine. For a proxy on another host, widen it
    # (docs/HOSTING.md step 5) and firewall the port so only the proxy can reach it.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck: *healthcheck

  worker:
    image: scholarsync:production
    command: ["python", "manage.py", "run_worker"]
    env_file: .env
    environment:
      <<: *forced
      SKIP_PREPARE: "1" # only web migrates
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
