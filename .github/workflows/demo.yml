# Branch `demo` only: check, migrate, build and deploy the public demo
# (docs/design/2026-11-28-hosted-demo-design.md 5.4; setup in docs/hosted-demo.md).
# The project's own Git deploys are off, so this workflow is the only way a version goes live.
# The nightly reset is a cron job in vercel.json, not here: GitHub runs scheduled workflows only
# from the default branch.
name: Demo

on:
  push:
    branches: [demo]

permissions:
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false  # never stop a deploy halfway through its migrations

env:
  VERCEL_CLI: vercel@65.15.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scholarsync
          POSTGRES_PASSWORD: scholarsync
          POSTGRES_DB: scholarsync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scholarsync -d scholarsync"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://scholarsync:scholarsync@localhost:5432/scholarsync
      DJANGO_DEBUG: "true"
      SITE_OPERATOR_NAME: ScholarSync CI
      PRIVACY_CONTACT_EMAIL: privacy@scholarsync.test
      EMAIL_URL: smtp://localhost:25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -n auto

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    env:
      # The CLI reads these from the environment, so the token is never on a command line.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-dev
      - name: Fetch the production settings from the project
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production
      # Only the direct database URL leaves the pulled file, masked before anything can print it;
      # the rest of the production settings are never exported into this shell (public logs).
      - name: Migrate (direct connection) before the new code goes live
        run: |
          url="$(uv run --no-dev python scripts/demo_env_value.py DATABASE_URL_UNPOOLED .vercel/.env.production.local)"
          echo "::add-mask::$url"
          export DJANGO_ENV_FILE=.vercel/.env.production.local
          DATABASE_URL="$url" uv run --no-dev python manage.py migrate --noinput
          DATABASE_URL="$url" uv run --no-dev python manage.py createcachetable
      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod
      - name: Deploy
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod
