name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scholarsync
          POSTGRES_PASSWORD: scholarsync
          POSTGRES_DB: scholarsync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scholarsync -d scholarsync"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://scholarsync:scholarsync@localhost:5432/scholarsync
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - name: Build the front end (django-vite and staticfiles checks need static/dist)
        run: npm --prefix frontend run build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Deploy checks (production-like settings)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-deploy-check-only-0123456789abcdefghijklmnopqrstuvwxyzABCD
        run: uv run python manage.py check --deploy --fail-level WARNING
      - run: uv run pytest -n auto
      - name: Dependency audit
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
      - run: npm run budget
      - run: npm audit --audit-level=high
