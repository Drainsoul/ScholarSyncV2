services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: scholarsync
      POSTGRES_PASSWORD: scholarsync
      POSTGRES_DB: scholarsync
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarsync -d scholarsync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
