[project]
name = "scholarsync"
version = "0.1.0"
description = "ScholarSync V2: City of Taguig scholarship platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.18,<5.3",
    "environs[django]>=15.2",
    "psycopg[binary]>=3.3.6",
    "django-vite>=3.2",
    "whitenoise>=6.12",
    "django-csp>=4.0",
    "sentry-sdk>=2.72",
    "django-htmx>=1.29",
    "django-template-partials>=25.3",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "pytest-xdist>=3.8",
    "factory-boy>=3.3.3",
    "ruff>=0.17",
    "mypy>=2.4",
    "django-stubs[compatible-mypy]>=6.1.2",
    "pytest-playwright>=0.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: Playwright browser tests; run with -m e2e --ds=config.e2e_settings --browser chromium"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ['^docs/', '^frontend/', '^static/', '^staticfiles/', '^\.venv/']

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["environs.*", "csp.*", "django_vite.*", "whitenoise.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
