[project]
name = "scholarsync"
version = "0.1.0"
description = "Scholarship management platform modelled on the City of Taguig's programs (unofficial)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Kenneth Planas" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.18,<5.3",
    "environs[django]>=15.2",
    "psycopg[binary]>=3.3.6",
    "django-vite>=3.2",
    "whitenoise>=6.12",
    "django-csp>=4.0",
    "sentry-sdk>=2.72",
    "django-htmx>=1.29",
    "django-template-partials>=25.3",
    "gunicorn>=26.2.0",
    "django-allauth[mfa,socialaccount]==65.20.1",
    "argon2-cffi==25.1.0",
    "boto3==1.43.118",
    "filetype==1.2.0",
    "pillow==13.0.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "cryptography==50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "pytest-xdist>=3.8",
    "factory-boy>=3.3.3",
    "ruff>=0.17",
    "mypy>=2.4",
    "django-stubs[compatible-mypy]>=6.1.2",
    "pytest-playwright>=0.10",
    "time-machine==3.5.1",
    "moto[server]==5.2.4",
    "types-openpyxl==3.1.5.20261017",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: Playwright browser tests; run with -m e2e --ds=config.e2e_settings --browser chromium"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/migrations/**" = ["E501", "I001"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ['^docs/', '^frontend/', '^static/', '^staticfiles/', '^\.venv/', '^scripts/export_legacy_model\.py$']

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["allauth.*", "environs.*", "csp.*", "django_vite.*", "whitenoise.*", "boto3.*", "botocore.*", "filetype.*", "moto.*", "gunicorn.*", "dj_email_url"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
