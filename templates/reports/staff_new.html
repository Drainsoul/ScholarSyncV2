{% extends "layouts/staff.html" %}{% load ui %}
{% block title %}Send a report{% endblock %}
{% block content %}
  <div class="page-header">
    <div>
      <p class="text-sm"><a href="{% url 'reports:list' program=program.slug %}">Reports</a></p>
      <h1>Send a report</h1>
      <p class="page-header__meta">The scholarship office reviews it and tells you here.</p>
    </div>
  </div>
  <section class="card" aria-label="Report">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "reports/_form_fields.html" %}
      <div class="btn-row"><button type="submit" class="btn btn--primary">Send report</button></div>
    </form>
  </section>
{% endblock %}
