{% extends "programs/settings/base.html" %}{% load ui %}
{% block settings %}
<section class="card" aria-labelledby="document-form-title">
  <h2 class="card__title" id="document-form-title">Edit {{ document.label }}</h2>
  <p class="text-sm text-muted">Code: {{ document.code }}</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "components/form_errors.html" %}
    {% for bound_field in form %}{% field bound_field %}{% endfor %}
    <div class="btn-row">
      <button type="submit" class="btn btn--primary">Save document</button>
      <a class="btn btn--secondary" href="{% url 'settings:documents' program=program.slug %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
