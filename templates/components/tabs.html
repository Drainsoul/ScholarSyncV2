<nav class="tabs" aria-label="{{ tabs_label|default:'Sections' }}">
  {% for tab in tabs %}<a href="{{ tab.url }}"{% if tab.current %} aria-current="page"{% endif %}>{{ tab.label }}{% if tab.count %}<span class="count{% if tab.current %} count--current{% endif %}">{{ tab.count }}</span>{% endif %}</a>{% endfor %}
</nav>
