{% load ui %}<ul class="{{ list_class }}" role="list"{% if labelled_by %} aria-labelledby="{{ labelled_by }}"{% endif %}>
  {% for item in nav_list_items %}<li><a href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}>{% if item.icon %}{% icon item.icon %}{% endif %}<span>{{ item.label }}</span>{% if item.count %}<span class="count count--accent">{{ item.count }}</span>{% endif %}</a></li>{% endfor %}
</ul>
