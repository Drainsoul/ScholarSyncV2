{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn--secondary" id="page-prev" href="{% querystring page=page.previous_page_number %}" rel="prev">Previous</a>{% endif %}
  <p class="pagination__status">Page {{ page.number }} of {{ page.paginator.num_pages }}</p>
  {% if page.has_next %}<a class="btn btn--secondary" id="page-next" href="{% querystring page=page.next_page_number %}" rel="next">Next</a>{% endif %}
</nav>
{% endif %}
