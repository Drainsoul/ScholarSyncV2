{# Light, Dark or System (spec §12 rev 29, rev 31): a plain form, so it works without script. Pass where ("menu" or "auth") for a unique label id. #}
<form class="theme-choice theme-choice--{{ where }}" method="post" action="{% url 'theme_set' %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <p class="theme-choice__label" id="theme-choice-{{ where }}">Theme</p>
  <div class="theme-choice__options" role="group" aria-labelledby="theme-choice-{{ where }}">
    <button type="submit" name="theme" value="light" aria-pressed="{% if theme == 'light' %}true{% else %}false{% endif %}">Light</button>
    <button type="submit" name="theme" value="dark" aria-pressed="{% if theme == 'dark' %}true{% else %}false{% endif %}">Dark</button>
    <button type="submit" name="theme" value="system" aria-pressed="{% if not theme %}true{% else %}false{% endif %}">System</button>
  </div>
</form>
